name: Publish to Cafe24

on:
  push:
    branches: [publish]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: ${{ vars.DEPLOY_APP_DIR || 'jyts' }}
  PHP_BIN: ${{ vars.DEPLOY_PHP_BIN || '/usr/local/php84/bin/php' }}
  WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT || 'www' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, intl, zip
          coverage: none

      - name: Install frontend packages
        run: pnpm install --frozen-lockfile

      - name: Lint and build frontend
        run: |
          pnpm lint
          pnpm build

      - name: Backend tests (SQLite in-memory)
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan test
          rm .env

      - name: Install production PHP packages
        working-directory: backend
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Package release
        run: |
          tar -czf release.tar.gz -C backend \
            --exclude='./.env' --exclude='./.env.*' \
            --exclude='./tests' --exclude='./storage' \
            --exclude='./node_modules' --exclude='./.phpunit.cache' \
            --exclude='./bootstrap/cache/*.php' \
            .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RAW_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_USER: ${{ secrets.DEPLOY_USER }}
          RAW_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          # Secrets pasted with stray spaces/newlines would otherwise break DNS lookup and SSH login.
          HOST="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          USER_NAME="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          PORT="$(printf '%s' "$RAW_PORT" | tr -d '[:space:]')"
          { echo "SSH_HOST=$HOST"; echo "SSH_USER=$USER_NAME"; echo "SSH_PORT=$PORT"; } >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          # Values pasted on Windows carry CRLF, which makes every known_hosts line unparsable.
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | grep -v '^#' > ~/.ssh/known_hosts || true
          LOOKUP="$HOST"
          [ "$PORT" = 22 ] || LOOKUP="[$HOST]:$PORT"
          if ! timeout 15 bash -c ": </dev/tcp/$HOST/$PORT" 2>/dev/null; then
            echo "::error::GitHub Actions(해외 서버)에서 DEPLOY_HOST 의 SSH 포트로 연결할 수 없습니다."
            echo "DEPLOY_HOST 글자 수: ${#HOST} (wkkim97b.mycafe24.com 이면 21)"
            echo "확인된 IPv4 주소 수: $(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u | wc -l)"
            if timeout 10 bash -c ": </dev/tcp/$HOST/443" 2>/dev/null; then
              echo "HTTPS(443) 연결 성공 → 주소는 맞고, SSH(${PORT}) 포트만 해외/클라우드 IP 에서 막혀 있습니다."
            else
              echo "HTTPS(443) 연결도 실패 → DEPLOY_HOST 값이 잘못되었을 가능성이 큽니다."
            fi
            exit 1
          fi
          if ! ssh-keygen -F "$LOOKUP" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS 에 DEPLOY_HOST(포트 $PORT)와 일치하는 서버 키가 없습니다. README 8-2 를 참고해 다시 등록하세요."
            echo "등록된 줄 수: $(wc -l < ~/.ssh/known_hosts), 그중 올바른 키 줄 수: $(ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | wc -l)"
            echo "서버가 현재 제시하는 키 지문 (내 PC에서 확인한 값과 비교용):"
            ssh-keyscan -T 15 -p "$PORT" "$HOST" 2>&1 | grep -v '^#' | ssh-keygen -lf - || true
            exit 1
          fi
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "SSH_AUTH=key" >> "$GITHUB_ENV"
          elif [ -n "$SSH_PASSWORD" ]; then
            sudo apt-get install -y -qq sshpass > /dev/null
            echo "SSH_AUTH=password" >> "$GITHUB_ENV"
          else
            echo "::error::DEPLOY_SSH_KEY 또는 DEPLOY_PASSWORD secret 을 등록하세요."
            exit 1
          fi

      - name: Upload and activate release
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          HOST="$SSH_HOST"
          USER="$SSH_USER"
          PORT="$SSH_PORT"
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          OPTS=(-o StrictHostKeyChecking=yes)
          if [ "$SSH_AUTH" = key ]; then
            OPTS+=(-i ~/.ssh/deploy_key -o BatchMode=yes)
            run_ssh() { ssh "${OPTS[@]}" -p "$PORT" "$@"; }
            run_scp() { scp "${OPTS[@]}" -P "$PORT" "$@"; }
          else
            OPTS+=(-o PreferredAuthentications=password -o PubkeyAuthentication=no)
            run_ssh() { sshpass -e ssh "${OPTS[@]}" -p "$PORT" "$@"; }
            run_scp() { sshpass -e scp "${OPTS[@]}" -P "$PORT" "$@"; }
          fi
          run_ssh "$USER@$HOST" "mkdir -p \"\$HOME/$APP_DIR/incoming\""
          run_scp release.tar.gz .github/deploy/remote-release.sh .github/deploy/www-index.php "$USER@$HOST:$APP_DIR/incoming/"
          run_ssh "$USER@$HOST" "bash \"\$HOME/$APP_DIR/incoming/remote-release.sh\" '$APP_DIR' '$RELEASE' '$PHP_BIN' '$WEB_ROOT'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
